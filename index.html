<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repasa · Modo clase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: aula animada; el profe proyecta, la mascota explica con cariño y un poco de burla
   IDEA: pantalla de concurso de clase, con tutor en videollamada al costado
   PICTURE: mascotas propias por carrera (SVG), grandes en el modo clase
   COLOUR and TYPE: pizarra azul profundo, rojo error, verde acierto, cada área con su color; Nunito
   LAYOUT: inicio = grilla de áreas; clase = pregunta y 4 opciones a la izquierda, mascota a la derecha */
:root{color-scheme:light dark;
--bg:light-dark(#e7eef5,#0f1c28);--card:light-dark(#fff,#182a3a);--card2:light-dark(#f1f5f9,#203547);
--ink:light-dark(#10202e,#e8f1f8);--mute:light-dark(#566879,#93a9bb);--line:light-dark(#d3dee8,#2c465b);
--blue:#1f8ef1;--red:#e5273f;--redbg:light-dark(#fde7ea,#4a1620);--green:#16a864;--greenbg:light-dark(#e2f7ec,#0f3a28);--amber:#f5a524;--acc:var(--blue)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:12px max(3vw,14px);background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:4}
.brand{font-weight:900;font-size:22px;display:flex;align-items:center;gap:8px;margin-right:auto;background:none;border:0;padding:0}
.brand i{width:30px;height:30px;border-radius:10px;background:var(--amber)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-weight:800;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.wrap{max-width:1240px;margin:0 auto;padding:24px max(3vw,14px) 60px}
h1{font-size:clamp(28px,4vw,44px);line-height:1.05;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 22px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mod{background:var(--card);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 24px #0b1a2a18}
.mod .art{background:var(--c);height:150px;display:grid;place-items:center}
.mod .art svg{height:136px}
.mod .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.mod h3{margin:0;font-size:20px;line-height:1.15}
.mod small{color:var(--mute);font-weight:700}
.mod .row{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.mod .row .btn{flex:1;justify-content:center}
.new{border:3px dashed var(--line);background:transparent;border-radius:22px;min-height:260px;font-weight:900;font-size:20px;color:var(--mute)}
.panel{background:var(--card);border-radius:22px;padding:clamp(16px,3vw,28px);margin-bottom:16px}
label{font-weight:800;font-size:15px;display:block;margin:12px 0 4px}
input[type=text],textarea,select{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-size:16px}
textarea{min-height:64px;resize:vertical}
.qlist{display:grid;gap:8px;margin-top:12px}
.qi{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card2)}
.qi span{flex:1;font-weight:700}
.optEd{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:12px;border-radius:16px;background:var(--card2);margin-top:10px;border:2px solid transparent}
.optEd.isok{border-color:var(--green)}
.optEd .lt{display:grid;place-items:center;align-content:start;gap:4px;font-weight:900;font-size:20px}
.optEd .lt input{width:22px;height:22px;accent-color:var(--green)}
.optEd textarea{min-height:52px;margin-top:6px;font-size:15px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{border:3px solid transparent;border-radius:16px;background:var(--c);padding:4px;width:76px;height:76px}
.pick button[aria-pressed=true]{border-color:var(--ink)}
.pick svg{width:100%;height:100%}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-weight:800}
.seg button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.hint{font-size:14px;color:var(--mute);margin-top:8px}
.ai{border:2px dashed var(--acc);border-radius:18px;padding:4px 16px 14px;margin:14px 0;background:var(--card2)}
.ai summary{font-weight:900;font-size:18px;cursor:pointer;min-height:48px;display:flex;align-items:center}
.ai ol{margin:6px 0 0;padding-left:22px;display:grid;gap:14px}
.ai li{padding-left:4px}.ai li>b{display:block;margin-bottom:6px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;display:inline-flex;align-items:center;color:inherit;text-decoration:none}
.mok{color:var(--green);font-weight:800}.mbad{color:var(--red);font-weight:800}
.prev{display:grid;gap:8px;margin-top:12px}
.prev label{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;margin:0;padding:12px;border-radius:14px;background:var(--card);font-weight:700}
.prev input{width:22px;height:22px;margin-top:2px}.prev small{display:block;color:var(--mute)}
.tip{background:light-dark(#fff6e0,#3a2c0c);border-radius:14px;padding:10px 14px;font-size:15px;margin-top:14px}
/* modo clase */
.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,30%);gap:18px;padding:18px max(2vw,12px);min-height:calc(100vh - 70px)}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-weight:900;padding:6px 14px;border-radius:99px;background:var(--card);white-space:nowrap}
.pill.timer{background:var(--acc);color:#fff;min-width:64px;text-align:center}
.pill.timer.low{background:var(--red)}
.teams{display:flex;gap:8px;flex-wrap:wrap}
.team{padding:6px 14px;border-radius:12px;background:var(--card);font-weight:900;border:3px solid transparent;white-space:nowrap}
.team.turn{border-color:var(--amber)}
.qbox{background:var(--card);border-radius:24px;padding:clamp(18px,2.4vw,34px);margin-top:14px}
.qbox .ql{color:var(--mute);font-weight:800}
.qbox h2{font-size:clamp(26px,3.4vw,48px);line-height:1.1;margin:6px 0 16px;text-wrap:balance}
.sol{display:none;border-radius:18px;padding:12px 18px;margin-bottom:14px;color:#fff;font-size:clamp(16px,1.5vw,21px)}
.sol.show{display:block}.sol.bad{background:var(--red)}.sol.good{background:var(--green)}
.sol b{display:block;font-size:clamp(20px,2vw,28px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:grid;grid-template-columns:clamp(44px,4vw,60px) minmax(0,1fr);gap:14px;align-items:start;text-align:left;padding:14px;border-radius:18px;border:3px solid var(--line);background:var(--card2);transition:transform .15s,box-shadow .2s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.let{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:clamp(18px,1.8vw,26px);background:var(--card);border:3px solid var(--line)}
.ot{font-weight:800;font-size:clamp(18px,2vw,28px);line-height:1.2;padding-top:6px}
.why{display:none;font-size:clamp(14px,1.2vw,17px);color:var(--mute);margin-top:6px;font-weight:700}
.done .why{display:block}
.opt.wrong{background:var(--redbg);border-color:var(--red)}.opt.wrong .let{background:var(--red);border-color:var(--red);color:#fff}
.opt.right{background:var(--greenbg);border-color:var(--green)}.opt.right .let{background:var(--green);border-color:var(--green);color:#fff}
.opt.now{transform:scale(1.02);box-shadow:0 0 0 5px var(--amber)}
.pnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.keys{font-size:13px;color:var(--mute);align-self:center}
.tutor{background:var(--card);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;align-self:start;position:sticky;top:84px}
.stage{background:var(--c);height:clamp(200px,30vh,320px);display:grid;place-items:center;position:relative}
.stage svg{height:90%}
.status{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#000a;color:#fff;font-size:13px;padding:3px 12px;border-radius:99px;white-space:nowrap}
.say{padding:16px 18px;font-size:clamp(17px,1.5vw,22px);font-weight:700;min-height:120px}
.ctr{display:flex;justify-content:center;gap:14px;padding:0 0 16px}
.round{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--card2)}
.round.on{background:var(--red);color:#fff}
.round svg{width:22px;height:22px}
.mouth{transform-box:fill-box;transform-origin:center}
.talk .mouth{animation:yap .2s infinite alternate}
@keyframes yap{to{transform:scaleY(1.9)}}
.lid{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.result{text-align:center;max-width:720px;margin:0 auto}
.result .big{font-size:clamp(44px,8vw,96px);font-weight:900;line-height:1}
.podium{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0}
.podium div{background:var(--card);border-radius:16px;padding:12px 20px;font-weight:900;font-size:22px}
.podium div.win{background:var(--amber);color:#1a1200}
@media(max-width:900px){.play{grid-template-columns:1fr}.tutor{position:static;order:-1;flex-direction:row;flex-wrap:wrap}.stage{width:140px;height:140px}.say{flex:1;min-height:0;font-size:16px}.ctr{width:100%}}
@media(max-width:600px){.opts{grid-template-columns:1fr}.top .btn span{display:none}}
@media(prefers-reduced-motion:reduce){.talk .mouth,.lid{animation:none}.opt{transition:none}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div id="app"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
{
/* ---------- mascotas ---------- */
const MASCOTS={
 buho:{name:'Bubo',kind:'owl',c:'#d9822b',b:'#f6d9a8',d:'#a85f1c',acc:'steth',bg:'#2f6f9e',pitch:1.15},

 conejo:{name:'Toto',kind:'llama',c:'#ece7f2',b:'#ffffff',d:'#f2a7bd',acc:'tooth',bg:'#2d6fa3',pitch:1.2,teeth:1},
 perro:{name:'Rocky',kind:'floppy',c:'#c9a36b',b:'#f3e6cc',d:'#8b6a3e',acc:'helmet',bg:'#5a6b7a',pitch:0.95},

};
function mascotSVG(key){
 const m=MASCOTS[key]||MASCOTS.buho,{c,b,d}=m;let s='';
 if(m.kind==='turtle')s+=`<ellipse cx="100" cy="118" rx="80" ry="70" fill="${d}"/><path d="M60 80 l20 -18 l40 0 l20 18 l-10 30 l-60 0Z" fill="#5a9a63" opacity=".7"/>`;
 if(m.kind==='owl')s+=`<path d="M52 62 L44 22 L80 46Z M148 62 L156 22 L120 46Z" fill="${d}"/>`;

 if(m.kind==='pointy')s+=`<path d="M46 78 L52 14 L92 48Z M154 78 L148 14 L108 48Z" fill="${c}"/><path d="M56 62 L58 30 L80 50Z M144 62 L142 30 L120 50Z" fill="${b}"/>`;
 if(m.kind==='llama')s+=`<ellipse cx="70" cy="34" rx="11" ry="30" fill="${c}" transform="rotate(-12 70 34)"/><ellipse cx="130" cy="34" rx="11" ry="30" fill="${c}" transform="rotate(12 130 34)"/><ellipse cx="70" cy="36" rx="5" ry="20" fill="${d}" transform="rotate(-12 70 34)"/><ellipse cx="130" cy="36" rx="5" ry="20" fill="${d}" transform="rotate(12 130 34)"/>`;
 if(m.kind==='parrot')s+=`<path d="M100 48 q-6 -36 14 -40 q-2 20 2 30 q10 -20 26 -18 q-14 14 -18 30Z" fill="${d}"/>`;
 s+=`<ellipse cx="100" cy="190" rx="58" ry="7" fill="#0003"/>`;
 s+=`<ellipse cx="100" cy="116" rx="${m.kind==='llama'?54:m.kind==='frog'?72:64}" ry="${m.kind==='frog'?64:72}" fill="${c}"/><ellipse cx="100" cy="142" rx="${m.kind==='penguin'?48:40}" ry="${m.kind==='penguin'?50:42}" fill="${b}"/>`;
 if(m.kind==='floppy')s+=`<ellipse cx="42" cy="92" rx="16" ry="36" fill="${d}" transform="rotate(18 42 92)"/><ellipse cx="158" cy="92" rx="16" ry="36" fill="${d}" transform="rotate(-18 158 92)"/>`;
 if(m.kind==='frog')s+=`<circle cx="74" cy="66" r="31" fill="${c}"/><circle cx="126" cy="66" r="31" fill="${c}"/>`;
 if(m.kind==='bird')s+=`<ellipse cx="100" cy="150" rx="50" ry="14" fill="#f2f2f2"/>`;
 if(m.kind==='penguin')s+=`<ellipse cx="100" cy="92" rx="44" ry="34" fill="${b}"/>`;
 if(m.mask)s+=`<ellipse cx="100" cy="80" rx="62" ry="20" fill="${d}"/>`;
 if(m.patches)s+=`<ellipse cx="74" cy="82" rx="27" ry="24" fill="${d}" transform="rotate(-20 74 82)"/><ellipse cx="126" cy="82" rx="27" ry="24" fill="${d}" transform="rotate(20 126 82)"/>`;
 s+=`<path d="M38 112 q-16 40 14 66 q10 -36 -14 -66Z M162 112 q16 40 -14 66 q-10 -36 14 -66Z" fill="${d}"/>`;
 s+=`<circle cx="76" cy="80" r="23" fill="#fff"/><circle cx="124" cy="80" r="23" fill="#fff"/><circle cx="79" cy="83" r="10" fill="#1b2430"/><circle cx="121" cy="83" r="10" fill="#1b2430"/><circle cx="83" cy="78" r="3.6" fill="#fff"/><circle cx="125" cy="78" r="3.6" fill="#fff"/>`;
 s+=`<circle class="lid" cx="76" cy="80" r="24" fill="${m.patches||m.mask?d:m.kind==='penguin'?b:c}"/><circle class="lid" cx="124" cy="80" r="24" fill="${m.patches||m.mask?d:m.kind==='penguin'?b:c}"/>`;
 s+=`<circle cx="62" cy="108" r="7" fill="#ff7a8a" opacity=".45"/><circle cx="138" cy="108" r="7" fill="#ff7a8a" opacity=".45"/>`;
 if(['owl','parrot','bird','penguin'].includes(m.kind))s+=`<path class="mouth" d="M89 102 L111 102 L100 ${m.kind==='parrot'||m.kind==='bird'?126:120}Z" fill="${m.kind==='parrot'?'#2b2b2b':m.kind==='bird'?'#e8c66a':'#f5a524'}"/>`;
 else if(m.kind==='frog')s+=`<path class="mouth" d="M78 112 q22 16 44 0" stroke="#2f5d22" stroke-width="5" fill="#9b2b3a" stroke-linecap="round"/>`;
 else s+=`<ellipse cx="100" cy="103" rx="7" ry="5" fill="#3a2a2a"/><ellipse class="mouth" cx="100" cy="116" rx="9" ry="4" fill="#6b1f2a"/>${m.teeth?'<rect x="94" y="119" width="12" height="9" rx="2" fill="#fff"/>':''}`;
 const A={
  steth:`<path d="M70 168 q30 18 60 0" stroke="#2b4459" stroke-width="5" fill="none"/><circle cx="130" cy="168" r="7" fill="#c7d3de" stroke="#2b4459" stroke-width="3"/>`,

  tooth:`<path d="M144 150 q8 -10 18 -4 q10 -6 18 4 q4 12 -4 22 l-4 16 q-3 6 -6 0 l-4 -12 l-4 12 q-3 6 -6 0 l-4 -16 q-8 -10 -4 -22Z" fill="#fff" stroke="#9fb3c8" stroke-width="2"/>`,
  gear:`<g transform="translate(160 160)"><circle r="16" fill="#f5c518"/><g fill="#f5c518">${[0,45,90,135,180,225,270,315].map(a=>`<rect x="-4" y="-22" width="8" height="10" transform="rotate(${a})"/>`).join('')}</g><circle r="6" fill="#7a5a00"/></g>`,

function loadVoices(){if(!synth)return;
 voices=synth.getVoices().filter(v=>/^es/i.test(v.lang)).map(v=>{let s=0;
  if(/natural|online|neural|enhanced|premium/i.test(v.name))s+=10;

const wait=ms=>new Promise(r=>setTimeout(r,ms));
function speakOne(text,pitch){
 return new Promise(res=>{
  if(prefs.muted||!synth){wait(Math.min(8000,1000+text.length*40)).then(res);return}
  let done=false;const fin=()=>{if(!done){done=true;res()}};
  try{const u=new SpeechSynthesisUtterance(text),v=curVoice();u.lang=v?v.lang:'es-PE';if(v)u.voice=v;
   u.rate=prefs.rate;u.pitch=pitch||1;u.onend=fin;u.onerror=fin;synth.speak(u);setTimeout(fin,3000+text.length*120/prefs.rate);
  }catch(e){wait(1000+text.length*40).then(fin)}
 });
}

function parseIA(txt){
 let t=String(txt||'').replace(/```(?:json)?/gi,'').trim();
 const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
 if(a<0||b<a)throw new Error('No encontré el JSON en lo que pegaste.');
 let j;try{j=JSON.parse(t.slice(a,b+1))}catch(e){throw new Error('El texto no es un JSON válido. Copia la respuesta completa de la IA.')}
 const list=Array.isArray(j)?j:(j.preguntas||[j]);
 const out=list.map(x=>{
  const q=String(x.pregunta||x.q||'').trim(),ops=x.opciones||x.options||[];
  if(!q||ops.length!==4)return null;
  const o=ops.map(op=>[String(op.texto||op.text||'').trim(),String(op.explicacion||op.explicación||op.explanation||'').trim(),op.correcta===true||op.correcta==='true'||op.correct===true]);
  if(o.some(z=>!z[0])||o.filter(z=>z[2]).length!==1)return null;
  for(let i=3;i>0;i--){const r=Math.floor(Math.random()*(i+1));[o[i],o[r]]=[o[r],o[i]]}
  return {q,ok:o.findIndex(z=>z[2]),o:o.map(z=>[z[0],z[1]||(z[2]?'Esta es la respuesta correcta.':'Esta no es la respuesta correcta.')])};
 }).filter(Boolean);
 if(!out.length)throw new Error('No encontré preguntas completas: cada una necesita 4 opciones y una sola correcta.');
 return out;
}

   <li><b>Pega aquí lo que respondió la IA</b><textarea id="aip" placeholder="Pega la respuesta completa de la IA"></textarea>
    <div class="links" style="margin-top:8px"><button class="btn main" id="aifill">Rellenar opciones</button></div><p class="hint" id="aim"></p></li></ol></details>
  <p class="hint">O escribe tú las 4 opciones y marca la correcta. En cada una explica por qué va o por qué no: eso es lo que dirá ${MASCOTS[m.m].name}.</p>
  ${q.o.map((o,k)=>`<div class="optEd ${q.ok===k?'isok':''}" data-k="${k}"><div class="lt">${L[k]}<input type="radio" name="ok" value="${k}" ${q.ok===k?'checked':''} aria-label="Opción ${L[k]} es la correcta"></div>
   <div><input type="text" class="ot_" placeholder="Opción ${L[k]}" value="${esc(o[0])}"><textarea class="ow_" placeholder="${q.ok===k?'Por qué es correcta':'Por qué no es correcta'}">${esc(o[1])}</textarea></div></div>`).join('')}
  <p class="hint">Marca con el círculo la respuesta correcta.</p>
  <div class="pnav"><button class="btn" id="cancel">Cancelar</button><button class="btn main" id="saveq">Guardar pregunta</button></div><p class="hint" id="err" style="color:var(--red)"></p></div></main>`;
 app.querySelectorAll('input[name=ok]').forEach(r=>r.onchange=()=>app.querySelectorAll('.optEd').forEach(d=>d.classList.toggle('isok',d.dataset.k===r.value)));
 $('cancel').onclick=()=>go({name:'module',id:m.id});
 $('aicopy').onclick=async()=>{const pq=$('qq').value.trim(),pc=$('aic').value.trim(),msg=$('aicm');
  if(!pq||!pc){msg.className='hint mbad';msg.textContent='Primero escribe la pregunta y la respuesta correcta.';return}
  const ok=await copyText(promptUna(m,pq,pc),$('aibox'));
  msg.className=ok?'hint mok':'hint';msg.textContent=ok?'Copiada. Ábrela en una IA, pega con Ctrl+V y envía.':'Copia el texto de arriba (ya está seleccionado) y pégalo en una IA.'};
 $('aifill').onclick=()=>{const msg=$('aim');
  try{const r=parseIA($('aip').value)[0];
   if(!$('qq').value.trim())$('qq').value=r.q;
   app.querySelectorAll('.optEd').forEach((d,k)=>{d.querySelector('.ot_').value=r.o[k][0];d.querySelector('.ow_').value=r.o[k][1];d.classList.toggle('isok',k===r.ok)});
   app.querySelector(`input[name=ok][value="${r.ok}"]`).checked=true;
   msg.className='hint mok';msg.textContent='Listo. Revisa las opciones y guarda la pregunta.';
   app.querySelector('.optEd').scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){msg.className='hint mbad';msg.textContent=e.message}};
 $('saveq').onclick=()=>{
  const nq={q:$('qq').value.trim(),ok:+app.querySelector('input[name=ok]:checked').value,o:[...app.querySelectorAll('.optEd')].map(d=>[d.querySelector('.ot_').value.trim(),d.querySelector('.ow_').value.trim()])};
  if(!nq.q)return $('err').textContent='Falta escribir la pregunta.';
  if(nq.o.some(o=>!o[0]))return $('err').textContent='Completa las 4 opciones.';
  nq.o.forEach((o,k)=>{if(!o[1])o[1]=k===nq.ok?'Esta es la respuesta correcta.':'Esta no es la respuesta correcta.'});
  if(view.qi>=0)m.qs[view.qi]=nq;else m.qs.push(nq);save();go({name:'module',id:m.id});
 };
}

let genList=[];
function genView(){
 const m=modBy(view.id);if(!m)return go({name:'home'});genList=[];
 header(`<button class="btn" id="back">← ${esc(m.name)}</button>`);$('back').onclick=()=>go({name:'module',id:m.id});
 app.innerHTML=`<main class="wrap" style="max-width:860px"><div class="panel">
  <h1>Crear varias preguntas con IA</h1><p class="sub">Gratis: Repasa prepara la instrucción, tú la pegas en una IA y luego pegas aquí su respuesta. ${MASCOTS[m.m].name} usará las explicaciones en clase.</p>
  <div class="ai" style="border-style:solid"><ol>
   <li><b>¿Sobre qué tema?</b><textarea id="gt" placeholder="Ej.: sistema digestivo: órganos, enzimas y funciones"></textarea>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px"><div><label for="gn" style="margin-top:0">Cantidad</label><select id="gn">${[5,10,15,20].map(n=>`<option ${n===10?'selected':''}>${n}</option>`).join('')}</select></div>
    <div><label for="gl" style="margin-top:0">Dificultad</label><select id="gl"><option>básica</option><option selected>intermedia</option><option>avanzada</option></select></div></div></li>
   <li><b>Copia la instrucción y pégala en una IA gratis</b><div class="links"><button class="btn main" id="gcopy">Copiar instrucción</button></div>
    <textarea id="gbox" hidden readonly style="margin-top:8px;min-height:120px;font-size:13px"></textarea><p class="hint" id="gcm"></p>${iaLinks}</li>
   <li><b>Pega aquí lo que respondió la IA</b><textarea id="gp" style="min-height:120px" placeholder="Pega la respuesta completa de la IA"></textarea>
    <div class="links" style="margin-top:8px"><button class="btn main" id="gread">Revisar preguntas</button></div><p class="hint" id="gm"></p></li></ol></div>
  <div id="gprev"></div></div></main>`;
 $('gcopy').onclick=async()=>{const t=$('gt').value.trim(),msg=$('gcm');
  if(!t){msg.className='hint mbad';msg.textContent='Primero escribe el tema.';return}
  const ok=await copyText(promptVarias(m,t,$('gn').value,$('gl').value),$('gbox'));
  msg.className=ok?'hint mok':'hint';msg.textContent=ok?'Copiada. Ábrela en una IA, pega con Ctrl+V y envía.':'Copia el texto de arriba (ya está seleccionado) y pégalo en una IA.'};
 $('gread').onclick=()=>{const msg=$('gm');
  try{genList=parseIA($('gp').value);msg.className='hint mok';msg.textContent='Encontré '+genList.length+' pregunta'+(genList.length===1?'':'s')+'. Desmarca las que no quieras.';
   $('gprev').innerHTML=`<div class="prev">${genList.map((g,i)=>`<label><input type="checkbox" data-g="${i}" checked><span>${esc(g.q)}<small>Correcta: ${L[g.ok]}) ${esc(g.o[g.ok][0])}</small></span></label>`).join('')}</div>
    <div class="pnav"><span class="keys">Luego podrás editar cada una en el módulo.</span><button class="btn main" id="gadd">Agregar al módulo</button></div>`;
   $('gadd').onclick=()=>{const pick=[...app.querySelectorAll('[data-g]')].filter(c=>c.checked).map(c=>genList[+c.dataset.g]);
    if(!pick.length){msg.className='hint mbad';msg.textContent='Marca al menos una pregunta.';return}
    m.qs.push(...pick);save();go({name:'module',id:m.id})};
   $('gprev').scrollIntoView({behavior:'smooth'});
  }catch(e){msg.className='hint mbad';msg.textContent=e.message;$('gprev').innerHTML=''}};
}

let setupOpt={teams:2,time:0,shuffle:true};
function setup(){
 const m=modBy(view.id);if(!m)return go({name:'home'});const ms=MASCOTS[m.m];
 header(`<button class="btn" id="back">← Módulos</button>`);$('back').onclick=()=>go({name:'home'});
 const seg=(key,vals)=>`<div class="seg">${vals.map(([v,t])=>`<button data-s="${key}" data-v="${v}" aria-pressed="${setupOpt[key]===v}">${t}</button>`).join('')}</div>`;
 app.innerHTML=`<main class="wrap" style="max-width:860px"><div class="panel" style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center">
  <div style="background:${ms.bg};border-radius:20px;padding:8px">${mascotSVG(m.m)}</div>
  <div><h1>${esc(m.name)}</h1><p class="sub" style="margin:0">${m.qs.length} preguntas con ${ms.name}.</p></div></div>
  <div class="panel"><label>Equipos</label>${seg('teams',[[0,'Sin equipos'],[2,'2 equipos'],[3,'3 equipos'],[4,'4 equipos']])}
  <p class="hint">Con equipos, cada pregunta le toca a un equipo por turno y suma punto si acierta.</p>
  <label>Tiempo por pregunta</label>${seg('time',[[0,'Sin tiempo'],[20,'20 s'],[30,'30 s'],[60,'60 s']])}
  <label style="display:flex;gap:10px;align-items:center;margin-top:16px"><input type="checkbox" id="mez" ${setupOpt.shuffle?'checked':''} style="width:22px;height:22px"> Mezclar el orden de las preguntas</label>
  ${synth&&!hasNatural()?`<p class="tip">Para una voz más natural, abre esta página en <b>Microsoft Edge</b>: trae voces naturales en español. Puedes elegirla en el botón Voz.</p>`:''}
  ${!synth?`<p class="tip">Este navegador no puede leer en voz alta. Las explicaciones se mostrarán escritas.</p>`:''}
  <div class="pnav"><span class="keys">En clase: A B C D para responder, Enter para seguir, R repetir, M silenciar, F pantalla completa.</span><button class="btn main" id="start" style="min-height:54px;font-size:20px">Empezar</button></div></div></main>`;
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{setupOpt[b.dataset.s]=+b.dataset.v;render()});
 $('mez').onchange=e=>setupOpt.shuffle=e.target.checked;
 $('start').onclick=()=>{
  const order=m.qs.map((_,i)=>i);if(setupOpt.shuffle)order.sort(()=>Math.random()-.5);
  play={m,mascot:MASCOTS[m.m],order,idx:0,picked:null,teams:Array(setupOpt.teams).fill(0),hits:0,time:setupOpt.time,left:0,seq:[]};
  go({name:'play'});
 };
}

function playView(){
 const p=play;if(!p)return go({name:'home'});
 const q=p.m.qs[p.order[p.idx]],done=p.picked!==null,good=p.picked===q.ok,T=p.teams.length,turn=T?p.idx%T:-1;
 document.documentElement.style.setProperty('--acc',p.mascot.bg);
 header(`<button class="btn" id="salir">Salir</button><button class="btn" id="fs">Pantalla<span>&nbsp;completa</span></button>`);
 $('salir').onclick=()=>go({name:'home'});$('fs').onclick=fullscreen;
 app.innerHTML=`<main class="play"><section>
  <div class="pbar"><span class="pill">${p.idx+1} de ${p.order.length}</span>${p.time?`<span class="pill timer" id="tm">${p.left||p.time}</span>`:''}
   <div class="teams">${p.teams.map((s,i)=>`<span class="team ${i===turn?'turn':''}">Equipo ${i+1}: ${s}</span>`).join('')}</div></div>
  <div class="qbox ${done?'done':''}"><div class="ql">${T?'Turno del Equipo '+(turn+1):'Pregunta '+(p.idx+1)}</div><h2>${esc(q.q)}</h2>
   <div class="sol ${done?'show '+(good?'good':'bad'):''}"><b>${good?'¡Correcto!':'No del todo'}</b>${done?esc(q.o[q.ok][0])+': '+esc(q.o[q.ok][1]):''}</div>
   <div class="opts">${q.o.map((o,k)=>`<button class="opt ${done&&k===q.ok?'right':''} ${done&&k===p.picked&&k!==q.ok?'wrong':''}" data-k="${k}"><span class="let">${L[k]}</span><span><span class="ot">${esc(o[0])}</span><span class="why">${esc(o[1])}</span></span></button>`).join('')}</div>
   <div class="pnav"><span class="keys">${done?'Toca una opción para que la vuelva a explicar.':'Haz clic en la respuesta que dijeron los alumnos.'}</span><button class="btn main" id="next" ${done?'':'disabled'}>${p.idx===p.order.length-1?'Ver resultados':'Siguiente →'}</button></div></div>
 </section>
 <aside class="tutor" style="--c:${p.mascot.bg}"><div class="stage">${mascotSVG(p.m.m)}<span class="status" id="status">${p.mascot.name} te escucha…</span></div>
  <div class="say" id="say">${done?'':'¿Cuál creen que es? Discútanlo y díganle su respuesta al profe.'}</div>
  <div class="ctr"><button class="round" id="rep" aria-label="Repetir explicación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  <button class="round ${prefs.muted?'':'on'}" id="mute" aria-label="${prefs.muted?'Activar voz':'Silenciar'}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 15c5-5 13-5 18 0l-3 3-3-2v-3a10 10 0 0 0-6 0v3l-3 2z"/></svg></button></div></aside></main>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
 $('next').onclick=next;$('rep').onclick=()=>{if(p.seq.length)speakSeq(p.seq)};
 $('mute').onclick=toggleMute;
 if(!done&&p.time&&!timerId)startTimer();
}
function startTimer(){const p=play;p.left=p.time;clearInterval(timerId);
 timerId=setInterval(()=>{p.left--;const t=$('tm');if(t){t.textContent=Math.max(0,p.left);t.classList.toggle('low',p.left<=5)}
  if(p.left<=0){clearInterval(timerId);timerId=null;if(p.picked===null){$('say').textContent='¡Se acabó el tiempo! Díganme su respuesta.';speakOne('¡Se acabó el tiempo!',p.mascot.pitch)}}},1000)}
function choose(k){
 const p=play,q=p.m.qs[p.order[p.idx]];
 if(p.picked!==null){speakSeq([[k,L[k]+', '+q.o[k][0]+'. '+q.o[k][1]]]);return}
 clearInterval(timerId);timerId=null;p.picked=k;
 const ok=q.ok,T=p.teams.length;if(k===ok){p.hits++;if(T)p.teams[p.idx%T]++}
 const seq=[];
 if(k===ok){seq.push([k,rnd(LINES.good)+' Es la '+L[k]+', '+q.o[k][0]+'. '+q.o[k][1]]);seq.push([null,'Y ojo por qué las otras no:'])}
 else{seq.push([null,rnd(LINES.bad)]);seq.push([k,'Eligieron la '+L[k]+', '+q.o[k][0]+'. '+q.o[k][1]]);seq.push([ok,'La correcta es la '+L[ok]+', '+q.o[ok][0]+'. '+q.o[ok][1]]);seq.push([null,'Y las demás tampoco:'])}
 q.o.forEach((o,j)=>{if(j!==k&&j!==ok)seq.push([j,L[j]+', '+o[0]+'. '+o[1]])});
 p.seq=seq;playView();speakSeq(seq,()=>{$('say').textContent='Cuando quieras, pasamos a la siguiente.'});
}
function next(){const p=play;if(p.picked===null)return;stopTalk();
 if(p.idx===p.order.length-1)return go({name:'result'});
 p.idx++;p.picked=null;p.seq=[];p.left=0;playView();}
function toggleMute(){prefs.muted=!prefs.muted;savePrefs();if(prefs.muted&&synth)try{synth.cancel()}catch(e){}
 const b=$('mute');if(b){b.classList.toggle('on',!prefs.muted);b.setAttribute('aria-label',prefs.muted?'Activar voz':'Silenciar')}}
function fullscreen(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}

function result(){
 const p=play;if(!p)return go({name:'home'});const T=p.teams.length,n=p.order.length;
 header(`<button class="btn" id="salir">← Módulos</button>`);$('salir').onclick=()=>go({name:'home'});
 const best=T?Math.max(...p.teams):0,winners=p.teams.map((s,i)=>s===best?i+1:0).filter(Boolean);
 const msg=T?(winners.length>1?'¡Empate entre los equipos '+winners.join(' y ')+'!':'¡Gana el Equipo '+winners[0]+'!'):(p.hits===n?'¡Perfecto! Futuras eminencias.':p.hits>=n/2?'Bien, pero repasen lo que fallaron.':'Hay que repasar. Sin miedo.');
 app.innerHTML=`<main class="wrap"><div class="result"><div class="tutor" style="--c:${p.mascot.bg};position:static;margin:0 auto 18px;max-width:320px"><div class="stage">${mascotSVG(p.m.m)}<span class="status" id="status"></span></div><div class="say" id="say">${esc(msg)}</div></div>
  <div class="big">${p.hits} de ${n}</div><p class="sub" style="margin:8px auto">respuestas correctas</p>
  ${T?`<div class="podium">${p.teams.map((s,i)=>`<div class="${s===best?'win':''}">Equipo ${i+1}: ${s}</div>`).join('')}</div>`:''}
  <div class="pnav" style="justify-content:center"><button class="btn main" id="again">Jugar otra vez</button><button class="btn" id="mods">Elegir otro módulo</button></div></div></main>`;
 $('again').onclick=()=>go({name:'setup',id:p.m.id});$('mods').onclick=()=>go({name:'home'});
 speakSeq([[null,msg]]);
}

function vozView(){
 header(`<button class="btn" id="back">← Volver</button>`);
 $('back').onclick=()=>go(view.back&&view.back.name!=='voz'?view.back:{name:'home'});
 const cv=curVoice();
 app.innerHTML=`<main class="wrap" style="max-width:760px"><div class="panel"><h1>Voz de las mascotas</h1>
  ${!synth?'<p class="tip">Este navegador no puede leer en voz alta.</p>':`
  <label for="vs">Voz</label><select id="vs">${voices.map(v=>`<option value="${esc(v.name)}" ${cv&&v.name===cv.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})${/natural|online|neural|enhanced|premium/i.test(v.name)?' ★ natural':''}</option>`).join('')||'<option>No hay voces en español</option>'}</select>
  <label for="rt">Velocidad: <span id="rv">${prefs.rate.toFixed(1)}</span></label><input type="range" id="rt" min="0.7" max="1.4" step="0.1" value="${prefs.rate}" style="width:100%">
  <div class="pnav"><button class="btn main" id="test">Probar voz</button></div>
  <p class="tip">Las voces marcadas con ★ suenan mucho más naturales. En Microsoft Edge aparecen voces como Camila (Perú), Dalia (México) o Jorge. En Chrome, las de Google son las mejores disponibles.</p>`}
  </div><div class="panel"><h2 style="margin-top:0">Preguntas de ejemplo</h2><p class="hint">Vuelve a cargar las preguntas de ejemplo de todas las carreras. Tus módulos nuevos se mantienen.</p>
  <button class="btn danger" id="reset">Restaurar ejemplos</button></div></main>`;
 if(synth){
  $('vs').onchange=e=>{prefs.voice=e.target.value;savePrefs()};
  $('rt').oninput=e=>{prefs.rate=+e.target.value;$('rv').textContent=prefs.rate.toFixed(1);savePrefs()};
  $('test').onclick=()=>{try{synth.cancel()}catch(e){}const was=prefs.muted;prefs.muted=false;speakOne('¡Hola! Soy Bubo. Así sonaré cuando explique las respuestas en clase.',1.1);prefs.muted=was};
 }
 $('reset').onclick=e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='¿Seguro? Se reemplazan los módulos de ejemplo';return}
  const ids=SEED.map(s=>s.id);mods=clone(SEED).concat(mods.filter(m=>!ids.includes(m.id)));save();b.textContent='Listo';};
}

document.addEventListener('keydown',e=>{
 if(view.name!=='play'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const k=e.key.toLowerCase(),i='abcd'.indexOf(k)>=0?'abcd'.indexOf(k):'1234'.indexOf(k);
 if(i>=0){choose(i);e.preventDefault()}
 else if(k==='enter'||k==='arrowright'){next();e.preventDefault()}
 else if(k==='r'){if(play.seq.length)speakSeq(play.seq)}
 else if(k==='m')toggleMute();
 else if(k==='f')fullscreen();
 else if(k==='escape')stopTalk();
});
render();
}
</script>
</body>
</html>
